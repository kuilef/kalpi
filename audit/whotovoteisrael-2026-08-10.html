<script>
(function(){
  const $=s=>document.querySelector(s);
  const app=$("#app");
  let lang = "he";
  const RTL = new Set(DATA.meta.rtl||["he","ar"]);
  const LS_KEY="wtvi2026_state_v1";
  const TRACK_URL="/.netlify/functions/track";
  const parties = DATA.parties;
  const pById = Object.fromEntries(parties.map(p=>[p.id,p]));
  const questions = DATA.questions;
  const qById = Object.fromEntries(questions.map(q=>[q.id,q]));
  const topics = DATA.topics;
  const tName = Object.fromEntries(topics.map(t=>[t.id,t.name]));
  const REVEAL_AT = 10;           // questions before % shown
  const MIN_RESULT = 6;           // allow ending with meaningful result

  // state
  let answers={}, importance={}, skipped=new Set(), current=null, started=false, resultTab="match", answeredOrder=[];
  const BATCH=10;
  let starNext=false, page=null, navPos=0, resetWarn=false;
  let prevField={}, lastRevealN=-1;

  // i18n helpers
  function L(o){ if(!o) return ""; if(typeof o==="string") return o; return o[lang]||o.he||o.en||""; }
  function t(k){ const o=DATA.ui[k]; return o?(o[lang]||o.he):k; }
  function CH(he,en,ar,ru){ return lang==="he"?he : lang==="ar"?(ar||en) : lang==="ru"?(ru||en) : en; }
  function fmtDate(iso){ const [y,m,d]=iso.split("-"); return d+"."+m+"."+y; }
  function setDir(){ document.documentElement.lang=lang; document.documentElement.dir=RTL.has(lang)?"rtl":"ltr"; }

  // scoring
  function scores(){
    const out={};
    parties.forEach(p=>{
      let num=0,den=0;
      for(const id in answers){
        const s=qById[id].stances[p.id];
        if(s===null||s===undefined) continue;
        const w=importance[id]||1;
        num += (1-Math.abs(answers[id]-s)/4)*w; den+=w;
      }
      out[p.id]={pct: den? (100*num/den):null, n:den};
    });
    return out;
  }
  function rankedIds(sc){ return parties.map(p=>p.id).filter(id=>sc[id].n>0).sort((a,b)=>sc[b].pct-sc[a].pct); }
  const answeredCount=()=>Object.keys(answers).length;

  // ---- local progress memory ----
  function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({answers,importance,skipped:[...skipped],answeredOrder,navPos,started,resultTab,lang,current:current?current.id:null})); }catch(e){} }
  function loadState(){ try{ const s=JSON.parse(localStorage.getItem(LS_KEY)||"null"); if(!s) return;
    answers=s.answers||{}; importance=s.importance||{}; skipped=new Set(s.skipped||[]); answeredOrder=s.answeredOrder||[]; navPos=s.navPos||0; started=!!s.started; resultTab=s.resultTab||"match";
    if(s.lang && ["he","en","ar","ru"].includes(s.lang)) lang=s.lang;
    current = s.current ? qById[s.current] : (started?pickNext():null);
  }catch(e){} }
  function clearState(){ try{ localStorage.removeItem(LS_KEY); }catch(e){} }

  // ---- anonymous usage analytics (aggregate counts only) ----
  function track(payload){ try{ fetch(TRACK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),keepalive:true}).catch(()=>{}); }catch(e){} }
  function trackFinish(){ try{ if(answeredCount()>0 && !sessionStorage.getItem("wtvi_fin")){ sessionStorage.setItem("wtvi_fin","1"); track({type:"finish",answered:answeredCount()}); } }catch(e){} }

  // adaptive next question
  function pickNext(){
    const pool = questions.filter(q=>!(q.id in answers) && !skipped.has(q.id));
    if(!pool.length) return null;
    const covered=new Set(Object.keys(answers).map(id=>qById[id].topic));
    if(answeredCount()<topics.length){
      const unc = pool.filter(q=>!covered.has(q.topic));
      const cand = unc.length?unc:pool;
      return byVariance(cand, parties.map(p=>p.id));
    }
    const sc=scores(); const ranked=rankedIds(sc);
    const lead= ranked.length? sc[ranked[0]].pct : 0;
    let tier = ranked.filter(id=>sc[id].pct>=lead-15);
    if(tier.length<3) tier=ranked.slice(0,Math.min(4,ranked.length));
    const scored = pool.map(q=>{
      const vals=tier.map(id=>q.stances[id]).filter(v=>v!==null&&v!==undefined);
      return {q, spread: vals.length>=2? Math.max(...vals)-Math.min(...vals):-1};
    }).filter(x=>x.spread>=0).sort((a,b)=>b.spread-a.spread);
    if(!scored.length) return pool[Math.floor(Math.random()*pool.length)];
    const top=scored.slice(0,3);
    return top[Math.floor(Math.random()*top.length)].q;
  }
  function byVariance(pool, ids){
    let best=pool[0],bv=-1;
    pool.forEach(q=>{
      const vals=ids.map(id=>q.stances[id]).filter(v=>v!==null&&v!==undefined);
      if(vals.length<2) return;
      const m=vals.reduce((a,b)=>a+b,0)/vals.length;
      const v=vals.reduce((a,b)=>a+(b-m)*(b-m),0)/vals.length;
      if(v>bv){bv=v;best=q;}
    });
    return best;
  }

  // ===== views =====
  function render(){ setDir(); renderLangs(); saveState(); $("#footFresh").textContent = t("data_updated").replace("{date}",fmtDate(DATA.meta.data_updated));
    $("#aboutLink").textContent=t("about"); $("#aboutLink").onclick=()=>{page="about";window.scrollTo(0,0);render();};
    const dl=$("#donateLink"); dl.textContent=(CH("❤ תרומה", "❤ Donate", `❤ تبرّع`, `❤ Пожертвовать`)); dl.onclick=()=>{page="donate";window.scrollTo(0,0);render();};
    const ai=$("#aiNote"); const aio=DATA.ui.ai_translation_note;
    if((lang==="ar"||lang==="ru") && aio && aio[lang]){ ai.textContent=aio[lang]; ai.style.display=""; } else { ai.style.display="none"; ai.textContent=""; }
    if(page==="about"){ aboutPage(); return; }
    if(page==="donate"){ donatePage(); return; }
    if(!started){ intro(); } else if(current){ quiz(); } else { results(); } }

  function renderLangs(){
    const box=$("#langs"); box.innerHTML="";
    [["he","עב"],["ar","ع"],["ru","Ру"],["en","EN"]].forEach(([code,lbl])=>{
      const b=document.createElement("button"); b.textContent=lbl; b.className=code===lang?"on":"";
      const has = ["he","en","ar","ru"].includes(code);
      if(!has){ b.disabled=true; b.title="בקרוב / coming soon"; }
      b.onclick=()=>{ lang=code; render(); };
      box.appendChild(b);
    });
  }

  function intro(){
    app.innerHTML="";
    const c=el("div","card pad");
    c.innerHTML = `<h1>${CH("למי כדאי לך להצביע?", "Which party should you vote for?", `لأي حزب ينبغي أن تصوّت؟`, `За какую партию вам стоит голосовать?`)}</h1>
      <p class="lead">${lang==="en"
        ? "Answer policy questions and watch the field of parties narrow to those closest to your views. The more you answer, the sharper your ranking. Stop whenever you like."
        : "ענו על שאלות בנושאי מדיניות, וצפו במפלגות מצטמצמות לאלו הקרובות ביותר לעמדותיכם. ככל שתענו על יותר שאלות, הדירוג יתחדד. אפשר לעצור בכל רגע."}</p>
      <div class="small" style="color:#5b6b80;font-weight:600;margin:2px 0 8px">${CH(`מאגר של ${DATA.questions.length} שאלות — השתדלו לענות על כולן כדי שההתאמות יהיו מדויקות.`, `A bank of ${DATA.questions.length} questions — try to answer them all so your matches are as accurate as possible.`, `بنك من ${DATA.questions.length} أسئلة — حاولوا الإجابة عليها كلها لتكون النتائج أدقّ.`, `Банк из ${DATA.questions.length} вопросов — постарайтесь ответить на все, чтобы совпадения были точными.`)}</div>

  function fieldScores(n){
    const subset=answeredOrder.slice(0,n); const out={};
    parties.forEach(p=>{ let num=0,den=0;
      subset.forEach(id=>{ const s=qById[id].stances[p.id]; if(s===null||s===undefined) return; const w=importance[id]||1; num+=(1-Math.abs(answers[id]-s)/4)*w; den+=w; });
      out[p.id]={pct:den?100*num/den:null,n:den};
    });
    return out;
  }
  function animateNum(elm, from, to, dur){
    const t0=performance.now();
    (function step(now){ const k=Math.min(1,(now-t0)/dur); const e=1-Math.pow(1-k,3); elm.textContent=Math.round(from+(to-from)*e)+"%"; if(k<1) requestAnimationFrame(step); })(t0);
  }
  function fieldHTML(){
    const revealN = Math.floor(answeredCount()/BATCH)*BATCH;
    const reveal = revealN>=BATCH;
    const sc = fieldScores(revealN);
    const ranked = rankedIds(sc);
    const order = reveal? ranked.concat(parties.map(p=>p.id).filter(id=>!ranked.includes(id))) : parties.map(p=>p.id);
    const lead = ranked.length? sc[ranked[0]].pct:0;
    const vals = ranked.map(id=>sc[id].pct);
    const mn = vals.length? Math.min(...vals):0, mx = vals.length? Math.max(...vals):100;
    const animate = reveal && revealN!==lastRevealN;   // a fresh batch reveal → tween
    const DUR=3500;
    const wrap=el("div","field bubbles"); const newPrev={};
    order.forEach((id,idx)=>{
      const p=pById[id]; const s=sc[id];
      let d=66, dim=false, pct=null;
      if(reveal && s.pct!==null){ pct=Math.round(s.pct);
        const norm = mx>mn ? (s.pct-mn)/(mx-mn) : 0.5;
        d=Math.round(50 + norm*78);
        if(s.pct < lead-22) dim=true; }
      const item=el("div","bubitem"+(dim?" dim":""));
      const fs=Math.max(13, Math.round(d*0.30));
      const bub=el("div","bub");
      bub.style.background=p.color;
      bub.style.animationDelay=((idx%6)*0.5).toFixed(1)+"s";
      const logo=`<img src="logos/${p.id}.png" onerror="this.remove()" alt=""/>`;
      bub.innerHTML = (reveal && pct!==null) ? `${logo}<span class="bp">${pct}%</span>` : `${logo}<span class="bi">${L(p.name).slice(0,1)}</span>`;
      if(reveal && pct!==null){
        newPrev[id]={d,pct};
        if(animate){
          const prev=prevField[id]; const fromD=prev?prev.d:66, fromPct=prev?prev.pct:0;
          bub.style.transition="none";
          bub.style.width=fromD+"px"; bub.style.height=fromD+"px"; bub.style.fontSize=Math.max(13,Math.round(fromD*0.30))+"px";
          const bp=bub.querySelector(".bp"); if(bp) bp.textContent=fromPct+"%";
          requestAnimationFrame(()=>requestAnimationFrame(()=>{
            bub.style.transition="width "+DUR+"ms cubic-bezier(.2,.7,.2,1),height "+DUR+"ms cubic-bezier(.2,.7,.2,1),font-size "+DUR+"ms cubic-bezier(.2,.7,.2,1)";
            bub.style.width=d+"px"; bub.style.height=d+"px"; bub.style.fontSize=fs+"px";
            if(bp) animateNum(bp, fromPct, pct, DUR);
          }));
        } else { bub.style.width=d+"px"; bub.style.height=d+"px"; bub.style.fontSize=fs+"px"; }
      } else { bub.style.width=d+"px"; bub.style.height=d+"px"; bub.style.fontSize=fs+"px"; }
      const nm=el("div","nm"); nm.textContent=L(p.name);
      item.appendChild(bub); item.appendChild(nm);
      wrap.appendChild(item);
    });
    if(reveal){ prevField=newPrev; lastRevealN=revealN; }
    return wrap;
  }

  function whyHTML(id, sc){
    const rows=[];
    for(const qid in answers){
      const s=qById[qid].stances[id]; if(s===null||s===undefined) continue;
      const agree=1-Math.abs(answers[qid]-s)/4;
      rows.push({qid,agree,w:importance[qid]||1});
    }
    rows.sort((a,b)=>b.agree-a.agree);
    const pos=rows.filter(r=>r.agree>=.75).slice(0,3);
    const neg=rows.filter(r=>r.agree<=.25).slice(-3).reverse();
    let html="";
    pos.forEach(r=> html+=`<div class="row"><span class="tag plus">✓</span><span>${L(qById[r.qid].text)}</span></div>`);
    neg.forEach(r=> html+=`<div class="row"><span class="tag minus">✕</span><span>${L(qById[r.qid].text)}</span></div>`);

    // blocs of user's matches
    const byBloc={};

        const pill=el("span","pill"); pill.innerHTML=`<span class="dot" style="width:16px;height:16px;background:${p.color};border-radius:50%"></span>${L(p.name)} · ${Math.round(sc[id].pct)}% · ${p.seats_poll}`; bl.appendChild(pill); });
      c.appendChild(bl);
    });
    // redline conflicts among top
    const conflicts=[];
    for(let i=0;i<top.length;i++) for(let j=i+1;j<top.length;j++){
      if(refuse(top[i],top[j])||refuse(top[j],top[i])) conflicts.push([top[i],top[j]]);
    }
    const ch=el("div"); ch.innerHTML=`<h3 style="margin-top:12px">${CH("בין ההתאמות המובילות שלך", "Among your top matches", `من بين أبرز تطابقاتك`, `Среди ваших лучших совпадений`)}</h3>`;
    if(conflicts.length){ conflicts.forEach(([a,b])=>{ const d=el("div","redflag");
      d.textContent= `${L(pById[a].name)} ⟂ ${L(pById[b].name)} — ${CH("פסלו זה את זה כשותפים.", "have ruled each other out as partners.", `استبعد كلٌّ منها الآخر كشريك.`, `исключили друг друга как партнёров.`)}`; ch.appendChild(d); }); }
    else { const d=el("div","note"); d.textContent= CH("אין וטו הדדי מוצהר בין ההתאמות המובילות שלך.", "No declared mutual vetoes among your top matches.", `لا يوجد فيتو متبادل مُعلن بين أبرز تطابقاتك.`, `Нет заявленных взаимных вето среди ваших лучших совпадений.`); ch.appendChild(d); }
    c.appendChild(ch);
    // threshold warnings
    const risk=ranked.filter(id=>co.redlines[id] && co.redlines[id].threshold_risk).slice(0,5);
    if(risk.length){ const d=el("div","redflag"); d.style.marginTop="10px";
      d.textContent=(CH("קרוב לאחוז החסימה (ייתכן שקול לא ייכנס לכנסת): ", "Near electoral threshold (a vote may not enter the Knesset): ", `قريب من نسبة الحسم (قد لا يدخل الصوت إلى الكنيست): `, `Близко к проходному барьеру (голос может не пройти в Кнессет): `))+risk.map(id=>L(pById[id].name)).join(", ");
      c.appendChild(d); }
    // redline notes
    const rn=el("div"); rn.style.marginTop="10px";
    top.forEach(id=>{ const r=co.redlines[id]; if(!r) return; const d=el("div","note"); d.style.marginBottom="6px";
      d.innerHTML=`<b>${L(pById[id].name)}:</b> ${L(r.note)}`; rn.appendChild(d); });
    c.appendChild(rn);
    app.appendChild(c);
  }
  function refuse(a,b){ const r=DATA.coalition.redlines[a]; if(!r) return false; const w=r.wont_sit_with||[];
    const cats={ netanyahu:["likud"], haredi:["shas","utj"], far_right:["otzma","rz"], arab:["hadash_taal","raam"], left:["democrats","together","yashar"] };
    if(w.includes(b)) return true;
    for(const cat of w){ if((cats[cat]||[]).includes(b)) return true; }
    return false;
  }

  // ===== spectrums =====
  function specScore(items, getVal){
    let num=0,n=0;
    for(const qid in items){ const v=getVal(qid); if(v===null||v===undefined) continue; num+=items[qid]*v; n++; }
    return n? {pct:((num/n)+2)/4*100, n}:{pct:null,n:0};
  }
  function spectrumsView(){
    const specs=DATA.spectrums||[]; const isRTL=RTL.has(lang);
    const c=el("div","card pad"); c.style.marginBottom="12px";
    c.innerHTML=`<h2>${CH("הצירים שלך", "Your spectrums", `محاورك`, `Ваши оси`)}</h2><div class="note">${CH("היכן אתם ממוקמים מול המפלגות בכל ציר — מתחדד ככל שעונים יותר.", "Where you sit vs. the parties on each axis — sharpens as you answer more.", `أين تقع مقارنةً بالأحزاب على كل محور — يصبح أدق كلما أجبت أكثر.`, `Где вы находитесь относительно партий на каждой оси — уточняется по мере ответов.`)}</div>`;
    specs.forEach(sp=>{
      const tot=Object.keys(sp.items).length;
      const u=specScore(sp.items, qid=> (qid in answers)?answers[qid]:null);
      const spec=el("div","spec");
      const lbl=el("div","lbl"); lbl.style.direction="ltr";
      lbl.innerHTML=`<span class="pole">${L(sp.low)}</span><span class="ttl">${L(sp.name)}</span><span class="pole">${L(sp.high)}</span>`;
      spec.appendChild(lbl);
      const track=el("div","track"); track.innerHTML=`<div class="mid"></div>`;
      parties.forEach(p=>{
        const ps=specScore(sp.items, qid=> qById[qid].stances[p.id]);
        if(ps.pct===null) return;
        const d=document.createElement("div"); d.className="pdot"; d.style.background=p.color;
        d.style.left=ps.pct+"%"; d.title=L(p.name)+" · "+Math.round(ps.pct);
        track.appendChild(d);
      });
      if(u.pct!==null){
        const y=document.createElement("div"); y.className="you"; y.style.left=u.pct+"%";
        const yl=document.createElement("div"); yl.className="youlbl"; yl.style.left=u.pct+"%"; yl.textContent=CH("אתם", "YOU", `أنتم`, `Вы`);
        track.appendChild(y); track.appendChild(yl);
      }
      spec.appendChild(track);
      const conf=el("div","conf");
      conf.textContent = u.pct===null ? (CH("ענו על שאלות בנושא כדי להתמקם.", "Answer questions on this topic to place yourself.", `أجب على أسئلة في هذا الموضوع لتحديد موقعك.`, `Ответьте на вопросы по этой теме, чтобы определить своё место.`))
         : (lang==="en"?`Based on ${u.n} relevant ${u.n===1?"question":"questions"} answered`:(u.n===1?`מבוסס על שאלה רלוונטית אחת שנענתה`:`מבוסס על ${u.n} שאלות רלוונטיות שנענו`));
      spec.appendChild(conf);
      c.appendChild(spec);
    });
    app.appendChild(c);
  }

  // generic meter block (diligence / internal democracy)
  function meterBlock(c, p, info, kind){
    const score=info.score;
    const col = kind==="green" ? `hsl(${Math.round((score||0)*1.25)},62%,42%)` : "#7b6bd6";
    const m=el("div","cmeter");
    const head = kind==="demo" ? (score==null?"—":score) : (info.label ? L(info.label) : (score==null?"—":score));
    const top=el("div","top");
    top.innerHTML=`<span class="dot" style="background:${p.color}"></span><span class="nm">${L(p.name)}</span><span class="sc" style="color:${kind==='green'?col:'#5a4fb0'};font-size:14px">${head}</span>`;
    m.appendChild(top);
    if(score!=null){ const bar=el("div","cbar"); const bi=el("i"); bi.style.width=Math.max(3,score)+"%"; bi.style.background=col; bar.appendChild(bi); m.appendChild(bar); }
    const cr=DATA.conduct.internaldemo_criteria;
    const hasDetails = info.note || (info.sub && cr);
    if(hasDetails){ const items=el("div","citems"); let html="";
      if(info.sub && cr){ ["selection","leadership","institutions","rotation"].forEach(k=>{ const v=info.sub[k]; if(v==null) return;
        html+=`<div style="margin:6px 0"><div style="display:flex;justify-content:space-between;font-size:12px"><span>${L(cr[k])}</span><span style="font-weight:700">${v}</span></div><div class="cbar" style="margin:3px 0"><i style="width:${Math.max(3,v)}%;background:#7b6bd6"></i></div></div>`; }); }
      if(info.note){ html+=`<div class="ci" style="color:var(--muted);margin-top:4px"><span>${L(info.note)} ${info.note.url?`<a href="${info.note.url}" target="_blank" rel="noopener">${CH("מקור","source","مصدر","источник")}</a>`:""}</span></div>`; }
      items.innerHTML=html;
      const tog=el("span","togglewhy"); tog.textContent=CH("פרטים ▾","Details ▾","تفاصيل ▾","Подробнее ▾"); tog.onclick=()=>items.classList.toggle("open");
      m.appendChild(tog); m.appendChild(items); }
    c.appendChild(m);
  }

      <div class="note">${CH("נתונים עובדתיים מבוססי מקורות על המפלגות — בנפרד מהתאמת העמדות שלכם.", "Factual, source-based data about the parties — separate from your opinion match.", `بيانات وقائعية مستندة إلى مصادر عن الأحزاب — منفصلة عن تطابق مواقفك.`, `Фактические данные о партиях на основе источников — отдельно от совпадения ваших взглядов.`)}</div>`;

  // 2D political map
  const SEC={q1:1,q2:1,q3:1,q4:1,q6:1,q24:1,q30:1,q31:1,q32:1, q5:-1,q7:-1,q26:-1,q27:-1,q28:-1,q29:-1,q33:-1};
  const REL={q9:1,q24:1,q38:1,q52:1,q53:1, q8:-1,q11:-1,q12:-1,q13:-1,q14:-1,q36:-1,q37:-1,q39:-1,q40:-1,q41:-1};
  function axisVal(getStance, MAP){ let s=0,n=0; for(const qid in MAP){ const v=getStance(qid); if(v===null||v===undefined) continue; s+=MAP[qid]*v; n++; } return n? s/n : null; }
  function mapView(){
    const c=el("div","card pad");
    c.innerHTML=`<h2>${CH("מפה פוליטית", "Political map", `الخريطة السياسية`, `Политическая карта`)}</h2><div class="note">${CH("היכן אתם ממוקמים ביחס למפלגות, על שני צירים. המיקום מקורב.", "Where you land among the parties on two axes. Position is approximate.", `أين تقع بين الأحزاب على محورين. الموقع تقريبي.`, `Где вы находитесь среди партий по двум осям. Положение приблизительное.`)}</div>`;
    const W=Math.min(560, app.clientWidth-40||520), H=W, pad=44, cx=W/2, cy=H/2, half=(W-2*pad)/2;
    const sx=v=>cx+(v/2)*half*0.92, sy=v=>cy-(v/2)*half*0.92;
    let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
    svg+=`<rect x="${pad}" y="${pad}" width="${W-2*pad}" height="${H-2*pad}" rx="14" fill="#fafbff" stroke="#e3e8f2"/>`;
    svg+=`<line x1="${cx}" y1="${pad}" x2="${cx}" y2="${H-pad}" stroke="#e0e6f2"/><line x1="${pad}" y1="${cy}" x2="${W-pad}" y2="${cy}" stroke="#e0e6f2"/>`;
    const axL=lang==="en"?{r:"Hawkish",l:"Diplomatic",t:"Religious",b:"Secular"}:{r:"ניצי / סיפוח",l:"מדיני / פשרה",t:"דתי / מסורתי",b:"חילוני / ליברלי"};
    svg+=label((cx+(W-pad))/2, cy-8, axL.r, "middle");
    svg+=label((pad+cx)/2, cy-8, axL.l, "middle");
    svg+=label(cx, pad-8, axL.t, "middle");
    svg+=label(cx, H-pad+16, axL.b, "middle");
    parties.forEach(p=>{
      const x=axisVal(qid=>qById[qid].stances[p.id], SEC), y=axisVal(qid=>qById[qid].stances[p.id], REL);

      svg+=`<circle cx="${sx(x).toFixed(1)}" cy="${sy(y).toFixed(1)}" r="9" fill="${p.color}" opacity=".88"/>`;
      const lx=Math.max(pad+38, Math.min(W-pad-38, sx(x)));
      svg+=`<text x="${lx.toFixed(1)}" y="${(sy(y)-13).toFixed(1)}" font-size="10.5" text-anchor="middle" direction="${RTL.has(lang)?'rtl':'ltr'}" fill="#33405c">${L(p.name)}</text>`;

        ? `<p><b>What this is.</b> A non-partisan tool that matches your answers to parties' <b>stated positions</b>. It is not voting advice and not a prediction.</p>
           <p><b>How it works.</b> Each statement is scored against every party's public stance (−2…+2). Your compatibility with a party is the weighted average agreement across the questions you answered where that party has a clear position; questions a party hasn't taken a stance on are excluded for it.</p>
           <p><b>Coalition view</b> shows declared redlines and is context only.</p>
           <p><b>Which parties are included.</b> The tool covers the parties likely to clear the 3.25% electoral threshold per recent polling — including the major new lists: <b>Together</b> (Bennett–Lapid), <b>Yashar</b> (Eisenkot) and <b>The Democrats</b> (Labor–Meretz). Smaller new lists currently polling below the threshold — such as The Reservists (Yoaz Hendel), the New Economic Party and others — are not included, because a vote for a list that misses the threshold may not enter the Knesset. The roster is updated if polling changes.</p>
           <p><b>Why ~150 questions?</b> The number of genuine dividing lines between the parties is finite. About 150 questions is enough to exhaust the meaningful differences and place you with high accuracy, without padding the bank with repetitive items that add no real signal. After every answer the engine serves the question that best separates the parties still closest to you, so even answering a small share of the bank already yields a reliable result — and the more you answer, the sharper it gets.</p>
           <p><b>Data.</b> Based on public 2025–2026 statements; some positions are inferred and flagged. Re-verified periodically.</p>`
        : `<p><b>מה זה.</b> כלי בלתי-מפלגתי שמתאים את תשובותיכם ל<b>עמדות המוצהרות</b> של המפלגות. אינו המלצת הצבעה ואינו תחזית.</p>
           <p><b>איך זה עובד.</b> כל היגד מקודד מול עמדת כל מפלגה (−2…+2). ההתאמה שלכם היא ממוצע ההסכמה המשוקלל על פני השאלות שעניתם בהן ושיש למפלגה עמדה ברורה לגביהן; שאלות שאין למפלגה עמדה בהן אינן נספרות עבורה.</p>
           <p><b>תמונת הקואליציה</b> מציגה קווים אדומים מוצהרים והיא מידע בלבד.</p>
           <p><b>אילו מפלגות נכללות.</b> הכלי כולל את המפלגות שסביר שיעברו את אחוז החסימה (3.25%) לפי הסקרים העדכניים — כולל הרשימות החדשות הגדולות: <b>ביחד</b> (בנט-לפיד), <b>ישר</b> (אייזנקוט) ו<b>הדמוקרטים</b> (עבודה-מרצ). רשימות חדשות וקטנות שנמצאות כיום מתחת לסף בסקרים — כגון המילואימניקים (יואז הנדל), המפלגה הכלכלית החדשה ואחרות — אינן נכללות, מכיוון שקול עבור רשימה שלא תעבור את אחוז החסימה עלול שלא להיכנס לכנסת. הרשימה תתעדכן אם מצב הסקרים ישתנה.</p>
           <p><b>למה כ-150 שאלות?</b> מספר קווי המחלוקת האמיתיים בין המפלגות מוגבל. כ-150 שאלות מספיקות כדי למצות את ההבדלים המהותיים ולמקם אתכם בדיוק גבוה, מבלי להעמיס שאלות שחוזרות על עצמן ואינן מוסיפות מידע. אחרי כל תשובה המנוע מגיש את השאלה שהכי מבדילה בין המפלגות הקרובות אליכם, כך שגם מי שעונה על חלק קטן מהמאגר מקבל תוצאה מהימנה — וככל שעונים יותר, הדיוק עולה.</p>
           <p><b>הנתונים.</b> מבוססים על הצהרות פומביות מ-2025–2026; חלק מהעמדות הן הסקה ומסומנות. מתעדכן מעת לעת.</p>`}
      </div>`;
    const teaser=el("div","banner"); teaser.style.cssText="background:#fff0f3;border-color:#f3c9d4;color:#8a2b46;margin-top:12px;cursor:pointer";
    teaser.textContent="❤ "+L(DATA.donation.refer); teaser.onclick=()=>{page="donate";window.scrollTo(0,0);render();}; c.appendChild(teaser);
    const fr=el("div","freshness"); fr.textContent=t("data_updated").replace("{date}",fmtDate(DATA.meta.data_updated)); c.appendChild(fr);
    app.appendChild(c);
  }

  function aboutPage(){ app.innerHTML=""; const back=el("button","btn secondary"); back.style.marginBottom="10px"; back.textContent=CH("חזרה →", "← Back", `رجوع →`, `← Назад`); back.onclick=()=>{page=null;render();}; app.appendChild(back); aboutView(); }

  function donatePage(){
    app.innerHTML=""; const dn=DATA.donation;
    const back=el("button","btn secondary"); back.style.marginBottom="10px"; back.textContent=CH("חזרה →", "← Back", `رجوع →`, `← Назад`); back.onclick=()=>{page=null;render();}; app.appendChild(back);
    const c=el("div","card pad");
    c.innerHTML=`<h2>${CH("תמיכה בכלי", "Support this tool", `ادعم هذه الأداة`, `Поддержать этот инструмент`)}</h2><div class="note" style="line-height:1.7">${L(dn.appeal)}</div>`;
    if(dn.url && dn.url!=="#"){ const b=document.createElement("a"); b.className="btn"; b.href=dn.url; b.target="_blank"; b.rel="noopener"; b.style.marginTop="14px"; b.style.textDecoration="none"; b.textContent=L(dn.button); c.appendChild(b); }
    else { const n=el("div","note"); n.style.marginTop="12px"; n.textContent=CH("(קישור התרומה טרם הוגדר — הוסיפו את donation.url בנתונים.)", "(Donation link not set yet — add donation.url in the data.)", `(لم يُحدَّد رابط التبرّع بعد — أضف donation.url في البيانات.)`, `(Ссылка для пожертвований ещё не задана — добавьте donation.url в данные.)`); c.appendChild(n); }
    app.appendChild(c);
  }

  // share image card (canvas)
  function shareCard(){
    const sc=scores(); const ranked=rankedIds(sc).slice(0,3);
    const S=1080, cv=document.createElement("canvas"); cv.width=S; cv.height=S; const x=cv.getContext("2d");
    if(!x){ return; }
    const g=x.createLinearGradient(0,0,S,S); g.addColorStop(0,"#eef1f9"); g.addColorStop(1,"#fff");
    x.fillStyle=g; x.fillRect(0,0,S,S);
    x.fillStyle="#13203b"; x.textAlign="right"; x.direction="rtl";
    x.font="800 60px Arial"; x.fillText("ההתאמות שלי", S-80, 130);
    x.font="600 30px Arial"; x.fillStyle="#5b6b80"; x.fillText("למי להצביע 2026?", S-80, 180);
    let y=300;
    ranked.forEach((id,i)=>{ const p=pById[id], pc=Math.round(sc[id].pct);
      x.fillStyle=p.color; roundRect(x, 80, y-50, S-160, 96, 20); x.fill();
      x.fillStyle="#fff"; x.textAlign="right"; x.font="800 46px Arial"; x.fillText((i+1)+". "+L(p.name), S-110, y+12);
      x.textAlign="left"; x.font="900 50px Arial"; x.fillText(pc+"%", 120, y+12);
      y+=130;
    });
    x.fillStyle="#7a8aa6"; x.textAlign="center"; x.font="500 26px Arial";
    x.fillText("מעודכן לפי "+fmtDate(DATA.meta.data_updated)+" · משקף עמדות מוצהרות, לא המלצת הצבעה", S/2, S-70);
    cv.toBlob(b=>{ const f=new File([b],"my-vote-2026.png",{type:"image/png"});
      if(navigator.canShare && navigator.canShare({files:[f]})){ navigator.share({files:[f], title:"למי להצביע 2026?"}).catch(()=>{}); }
      else { const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="my-vote-2026.png"; a.click(); }
    });
    function roundRect(c,x0,y0,w,h,r){ c.beginPath(); c.moveTo(x0+r,y0); c.arcTo(x0+w,y0,x0+w,y0+h,r); c.arcTo(x0+w,y0+h,x0,y0+h,r); c.arcTo(x0,y0+h,x0,y0,r); c.arcTo(x0,y0,x0+w,y0,r); c.closePath(); }
  }

  function el(tag,cls){ const e=document.createElement(tag); if(cls) e.className=cls; return e; }
  loadState();
  try{ if(!sessionStorage.getItem("wtvi_visit")){ sessionStorage.setItem("wtvi_visit","1"); track({type:"visit"}); } }catch(e){ track({type:"visit"}); }
  window.addEventListener("pagehide", trackFinish);
  render();
})();
</script>
